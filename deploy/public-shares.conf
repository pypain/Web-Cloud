# Public capability links only; no access to private file IDs or management API.
location ^~ /cloud/share/ {
    auth_basic off;
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://unix:/run/hxry-cloud/backend.sock:/share/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Cloud-Token "__BACKEND_TOKEN__";
    proxy_set_header X-Cloud-Public "1";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Cloud-Share "public" always;
}
