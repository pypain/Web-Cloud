# Private static preview. No backend or server-side file storage.
location = /cloud {
    alias /var/www/hxry-cloud/current/index.html;
    default_type text/html;
    auth_basic "Private cloud";
    auth_basic_user_file /etc/nginx/hxry-cloud.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /cloud/ {
    alias /var/www/hxry-cloud/current/;
    index index.html;
    auth_basic "Private cloud";
    auth_basic_user_file /etc/nginx/hxry-cloud.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
