# Both UI and storage API are private. Token is generated locally by the installer.
location ^~ /cloud/python-runtime/ {
    auth_basic off;
    limit_except GET { deny all; }
    alias /var/www/hxry-cloud/current/python-runtime/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /cloud/share/ {
    auth_basic off;
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://unix:/run/hxry-cloud/backend.sock:/share/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Cloud-Token "__BACKEND_TOKEN__";
    proxy_set_header X-Cloud-Public "1";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Cloud-Share "public" always;
}
location ^~ /cloud/api/ {
    auth_basic "Private cloud";
    auth_basic_user_file /etc/nginx/hxry-cloud.htpasswd;
    client_max_body_size 5g;
    client_body_timeout 120s;
    proxy_pass http://unix:/run/hxry-cloud/backend.sock:/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Cloud-Token "__BACKEND_TOKEN__";
    proxy_set_header X-Cloud-Public "0";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Cloud-Storage "server" always;
}
location = /cloud {
    alias /var/www/hxry-cloud/current/index.html;
    default_type text/html;
    auth_basic "Private cloud";
    auth_basic_user_file /etc/nginx/hxry-cloud.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /cloud/ {
    alias /var/www/hxry-cloud/current/;
    index index.html;
    auth_basic "Private cloud";
    auth_basic_user_file /etc/nginx/hxry-cloud.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
