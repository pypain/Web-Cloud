# Public application assets; sessions guard private storage. Token is generated locally.
location ^~ /cloud/python-runtime/ {
    auth_basic off;
    limit_except GET { deny all; }
    alias /var/www/hxry-cloud/current/python-runtime/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /cloud/share/ {
    auth_basic off;
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://unix:/run/hxry-cloud/backend.sock:/share/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Cloud-Token "__BACKEND_TOKEN__";
    proxy_set_header X-Cloud-Public "1";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Cloud-Share "public" always;
}
# Sessions are verified by the backend on every private API operation.
location ^~ /cloud/api/ {
    auth_basic off;
    client_max_body_size 5g;
    client_body_timeout 120s;
    proxy_pass http://unix:/run/hxry-cloud/backend.sock:/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Cloud-Token "__BACKEND_TOKEN__";
    proxy_set_header X-Cloud-Public "0";
    proxy_set_header X-Cloud-Client $proxy_protocol_addr;
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Cloud-Storage "accounts" always;
}
location = /cloud { return 308 /cloud/; }
location = /cloud/auth { return 308 /cloud/auth/; }
location = /cloud/admin { return 308 /cloud/admin/; }
location = /cloud/auth/ {
    auth_basic off;
    root /var/www/hxry-cloud/current;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /cloud/admin/ {
    auth_basic off;
    root /var/www/hxry-cloud/current;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# Application assets are public; uploaded files are exclusively under the protected API.
location ^~ /cloud/ {
    auth_basic off;
    alias /var/www/hxry-cloud/current/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
